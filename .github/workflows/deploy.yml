name: Deploy Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ap-south-1

      - name: Install Terraform and Terragrunt
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          wget -q https://releases.hashicorp.com/terraform/1.10.5/terraform_1.10.5_linux_amd64.zip
          unzip terraform_1.10.5_linux_amd64.zip
          sudo install terraform /usr/local/bin/terraform

          TG_VERSION="1.0.4"
          wget -q "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt_linux_amd64
          sudo install terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: Deploy VPC
        working-directory: dev/vpc
        env:
          TG_STATE_BUCKET: tg-learning-state-462025068285-ap-south-1
        run: |
          terragrunt init
          terragrunt validate
          terragrunt apply -auto-approve

      - name: Deploy EC2
        working-directory: dev/ec2
        env:
          TG_STATE_BUCKET: tg-learning-state-462025068285-ap-south-1
        run: |
          terragrunt init
          terragrunt validate
          terragrunt apply -auto-approve
