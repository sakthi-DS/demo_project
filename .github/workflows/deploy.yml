
name: Deploy Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Install Terraform and Terragrunt
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          wget -q https://releases.hashicorp.com/terraform/1.10.5/terraform_1.10.5_linux_amd64.zip
          unzip terraform_1.10.5_linux_amd64.zip
          sudo install terraform /usr/local/bin/terraform

          TG_VERSION="1.0.4"
          wget -q "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt_linux_amd64
          sudo install terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: Deploy VPC
        working-directory: dev/vpc
        env:
          TG_STATE_BUCKET: ${{ secrets.TG_STATE_BUCKET }}
        run: |
          terragrunt init
          terragrunt validate
          terragrunt apply -auto-approve

      - name: Deploy EC2
        working-directory: dev/ec2
        env:
          TG_STATE_BUCKET: ${{ secrets.TG_STATE_BUCKET }}
        run: |
          terragrunt init
          terragrunt validate
          terragrunt apply -auto-approve
